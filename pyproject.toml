[project]
name = "openhands-connect"
version = "0.1.0"
description = "MCP bridge to explicitly configured OpenHands execution environments"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0,<3",
    "pydantic>=2.11,<3",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
]

[project.scripts]
openhands-connect = "openhands_connect.mcp_server.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openhands_connect"]

[tool.pytest.ini_options]
testpaths = ["src/openhands_connect/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: opt-in test against a real OpenHands agent server (requires OH_CONNECT_INTEGRATION_* env)",
]
filterwarnings = ["error::DeprecationWarning:openhands_connect.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "C4", "DTZ", "PTH", "T20"]
ignore = [
    "S101",  # assert is expected in tests
    "S105", "S106",  # hardcoded-password checks: config tests use dummy placeholder strings
]

[tool.ruff.lint.per-file-ignores]
"src/openhands_connect/tests/*" = [
    "S105", "S106", "S108", "T20", "SLF001",
    # Test handlers are one-line fakes; a named def for each adds noise.
    "E731",
    # pytest.raises match= is a regex; several tests match plain substrings.
    "RUF043",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["openhands_connect"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
# Test bodies are fakes and assertions; strict per-function annotation adds
# noise without catching defects. Production modules stay fully strict.
module = ["openhands_connect.tests.*", "openhands_connect.tests"]
disable_error_code = ["no-untyped-def", "no-any-return"]

[dependency-groups]
dev = [
    "openhands-connect[dev]",
]
