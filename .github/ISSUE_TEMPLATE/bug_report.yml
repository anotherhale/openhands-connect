name: Bug report
description: Report a reproducible bug or unexpected behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thank you for helping improve OpenHands Connect. Please avoid posting secrets, credentials, or private task data."
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, OpenHands version, OpenHands Connect version, and client/runtime details.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets, tokens, private URLs, and sensitive data before sharing.
      render: text
