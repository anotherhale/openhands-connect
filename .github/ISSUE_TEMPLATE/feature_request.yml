name: Feature request
description: Propose an enhancement or new capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Describe the problem or opportunity. Please focus on the use case before proposing an implementation."
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your idea.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've considered.
